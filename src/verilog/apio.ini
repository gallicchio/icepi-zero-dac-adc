; For the Apio route of 1.0 (VS Code + the Apio extension).  Apio compiles every
; .sv file in this folder except the testbenches (*_tb.sv) and uses the one .lpf
; constraints file it finds.  Change top-module to pick the design to build:
; counter, sawtooth, sine, adc_leds, adc_stream, capture, loopback, lockin ...
[env:default]
board = icepi-zero
top-module = counter
